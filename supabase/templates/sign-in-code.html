<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:440px;margin:0 auto;padding:32px 24px;color:#121217">
  <div style="width:44px;height:44px;border-radius:14px;background:#121217;color:#fff;text-align:center;line-height:44px;font-size:22px">✦</div>
  <h1 style="font-size:22px;letter-spacing:-0.02em;margin:24px 0 8px">Your Nudge sign-in code</h1>
  <p style="font-size:15px;line-height:22px;color:#52525C;margin:0 0 24px">Enter this code in the app. It expires in one hour.</p>
  <div style="font-family:ui-monospace,Menlo,monospace;font-size:32px;letter-spacing:10px;font-weight:600;background:#F5F4F0;border-radius:16px;padding:18px 0;text-align:center">{{ .Token }}</div>

</div>
